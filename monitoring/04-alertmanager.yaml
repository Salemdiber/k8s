apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: ${GMAIL_FROM}
      smtp_auth_username: ${GMAIL_USERNAME}
      smtp_auth_password: ${GMAIL_APP_PASSWORD}
      smtp_require_tls: true

    route:
      group_by:
        - alertname
        - namespace
        - deployment
        - instance
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 3h
      receiver: gmail

    receivers:
      - name: local-ui
      - name: gmail
        email_configs:
          - to: ${GMAIL_TO}
            send_resolved: true
            headers:
              subject: '[AlgoArena] {{ .Status | toUpper }} - {{ .CommonLabels.alertname }}'
            html: |
              <h2>AlgoArena Alert: {{ .CommonLabels.alertname }}</h2>
              <p><strong>Status:</strong> {{ .Status }}</p>
              <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
              <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
              <hr>
              {{ range .Alerts }}
              <p>
                <strong>Instance:</strong> {{ .Labels.instance }}<br>
                <strong>Namespace:</strong> {{ .Labels.namespace }}<br>
                <strong>Deployment:</strong> {{ .Labels.deployment }}<br>
                <strong>Started:</strong> {{ .StartsAt }}
              </p>
              {{ end }}

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal:
          - alertname
          - namespace
          - deployment
          - instance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          command:
            - /bin/sh
            - -c
          args:
            - |
              sed \
                -e "s|\${GMAIL_FROM}|${GMAIL_FROM}|g" \
                -e "s|\${GMAIL_USERNAME}|${GMAIL_USERNAME}|g" \
                -e "s|\${GMAIL_APP_PASSWORD}|${GMAIL_APP_PASSWORD}|g" \
                -e "s|\${GMAIL_TO}|${GMAIL_TO}|g" \
                /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
              /bin/alertmanager \
                --config.file=/tmp/alertmanager.yml \
                --storage.path=/alertmanager \
                --web.listen-address=:9093
          ports:
            - name: web
              containerPort: 9093
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: GMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: alertmanager-gmail
                  key: from
            - name: GMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: alertmanager-gmail
                  key: username
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alertmanager-gmail
                  key: app_password
            - name: GMAIL_TO
              valueFrom:
                secretKeyRef:
                  name: alertmanager-gmail
                  key: to
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
            items:
              - key: alertmanager.yml
                path: alertmanager.yml
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: 9093
